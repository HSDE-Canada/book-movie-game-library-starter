<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-wrapper">
    <section class="library-app">
      <header class="app-header">
        <div>
          <p class="eyebrow">My Library</p>
          <h1 id="page-title">My Books 📖</h1>
          <p id="page-subtitle">Read, learn, and get inspired!</p>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-category="books">Books</button>
        <button class="tab" data-category="movies">Movies</button>
        <button class="tab" data-category="games">Games</button>
      </nav>

      <section class="toolbar">
        <input id="search-input" type="text" placeholder="Search by title or creator" />
        <button id="open-form-button">Add Item</button>
      </section>

      <section class="stats-bar" id="stats-bar"></section>
      <section class="library-grid" id="library-grid"></section>
    </section>
  </main>

  <section class="form-backdrop" id="add-form-section" hidden>
    <form class="add-form" id="add-item-form">
      <h2>Add New Item</h2>
      <input id="new-title" placeholder="Title" />
      <input id="new-creator" placeholder="Creator" />
      <input id="new-icon" placeholder="Icon" />
      <select id="new-cover-color">
        <option value="cover-blue">Blue</option>
        <option value="cover-green">Green</option>
        <option value="cover-red">Red</option>
        <option value="cover-orange">Orange</option>
      </select>
      <div class="form-actions">
        <button type="button" id="cancel-form-button">Cancel</button>
        <button type="submit">Save Item</button>
      </div>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
